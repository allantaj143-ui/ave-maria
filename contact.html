<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ave Maria Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ave Maria Restaurant & Cafe</h1>
        <p><b>Karambi Sub county, Kasese</b></p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-container">
        <section class="contact-info">
            <h2 style="color: yellowgreen;">Get in Touch</h2>
            <p>We look forward to hearing from you!</p>

            <address>
                <strong>Location:</strong> Karambi Sub county, Kasese<br>
                <strong>Phone:</strong> +256 776-172-474<br>
                <strong>Email:</strong> info@avemaria.ug<br>
            </address>
        </section>

        <section class="contact-form">
            <h3 style="color: darkseagreen;">Send Us a Message</h3>
            <form action="#" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
        
        <div class="image-placeholder">
            <img src="Ave15.jpeg" alt="">
            <img src="Ave14.jpeg" alt="">
            <img src="Ave16.jpeg" alt="">
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Ave Maria Restaurant. All rights reserved.</p>
    </footer>
</body>
</html>
